name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pyright
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright --pythonversion 3.12 engine.py vad.py http_api.py server.py

  test-import:
    name: Import & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install only the dependencies that are available on Linux.
      # Apple-Silicon-only libs (mlx-audio, mlx-whisper) and hardware drivers
      # (sounddevice) are excluded; conftest.py stubs them at session start so
      # tests that need the real libraries use importorskip/HAS_* guards and
      # skip cleanly.  python-multipart is needed for FastAPI file-upload routes.
      - run: |
          pip install \
            fastapi uvicorn httpx pysbd numpy scipy pydantic \
            pytest pytest-asyncio python-multipart \
            mcp mistral-common
      - name: Run tests
        run: pytest tests/ -v --tb=short

  test-api:
    name: HTTP API Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install \
            fastapi uvicorn httpx pysbd numpy scipy pydantic \
            python-multipart mcp mistral-common
      - name: Test API endpoints resolve
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from http_api import app
          # base_url must present a loopback Host: the _localhost_csrf_guard
          # (Origin/Host validation) 403s state-changing requests whose Host
          # header is not loopback, and the test client default Host is not.
          client = TestClient(app, base_url='http://localhost')

          # Health check
          r = client.get('/health')
          assert r.status_code == 200
          data = r.json()
          assert data['status'] in ('ok', 'degraded')
          assert 'engines' in data
          assert 'modalities' in data

          # Voices endpoint
          r = client.get('/v1/voices')
          assert r.status_code == 200
          data = r.json()
          assert 'engines' in data
          assert 'kokoro' in data['engines']

          # Jobs endpoint (empty)
          r = client.get('/v1/jobs')
          assert r.status_code == 200
          assert r.json()['total'] == 0

          # Filter endpoint
          r = client.post('/v1/filter', json={'text': 'thank you'})
          assert r.status_code == 200
          assert r.json()['is_hallucination'] == True

          r = client.post('/v1/filter', json={'text': 'hello world this is a real sentence'})
          assert r.status_code == 200
          assert r.json()['is_hallucination'] == False

          print('All API smoke tests passed')
          "

  typecheck-openclaw:
    name: OpenClaw Plugin Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate plugin manifest
        run: |
          node -e "
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('integrations/openclaw/openclaw.plugin.json'));
          const pkg = JSON.parse(fs.readFileSync('integrations/openclaw/package.json'));
          console.assert(manifest.id === 'mod3', 'Plugin ID mismatch');
          console.assert(manifest.contracts.speechProviders.includes('mod3'), 'Missing speech provider contract');
          console.assert(pkg.openclaw.extensions.length > 0, 'No extension entry');
          console.log('Plugin manifest valid');
          "
